<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B096C"/>
      <stop offset="100%" style="stop-color:#0D001A"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF72E1"/>
      <stop offset="100%" style="stop-color:#F54C7A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DD62ED"/>
      <stop offset="100%" style="stop-color:#0ddde5"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>

  <!-- Accent border glow -->
  <rect width="64" height="64" rx="14" ry="14" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>

  <!-- Initials JM -->
  <text
    x="32"
    y="43"
    font-family="Avenir, Arial, sans-serif"
    font-size="28"
    font-weight="700"
    text-anchor="middle"
    fill="url(#text-grad)"
    letter-spacing="-1"
  >JM</text>
</svg>
